name: auto-update

on:
    schedule:
        - cron: "0 */6 * * *"

    workflow_dispatch:

concurrency:
    group: auto-update
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: get current year
              run: echo "CURRENT_YEAR=$(TZ='Asia/Tokyo' date +'%Y')" >> $GITHUB_ENV

            - name: check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 2
                  sparse-checkout: |
                      .github
                      .gitignore
                      download-card-art.py
                      manifest.json
                      requirements.txt
                      card-art/${{ env.CURRENT_YEAR }}

            - name: configure git
              run: |
                  git config --global core.fileMode false
                  git config --global --add safe.directory "*"

            - name: set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: install Python dependencies
              run: |
                  python -m pip install -U pip
                  python -m pip install -r requirements.txt

            - name: update card art
              run: |
                  python download-card-art.py

            - name: get current time
              id: date
              run: echo "NOW=$(TZ='Asia/Tokyo' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

            - name: run pre-commit
              uses: pre-commit/action@v3.0.1
              with:
                  extra_args: --all-files
              continue-on-error: true

            - name: commit and push changes
              uses: stefanzweifel/git-auto-commit-action@v7
              id: commit
              with:
                  commit_message: "chore: bump data version to ${{ steps.date.outputs.NOW }}"
                  add_options: "--sparse"

            - name: update releases
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              if: steps.commit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
              run: |
                  if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
                      CHANGED_YEARS=$(ls card-art/ 2>/dev/null || true)
                  else
                      CHANGED_YEARS=$(git diff --name-only HEAD^ HEAD | grep 'card-art/' | cut -d'/' -f2 | sort -u || true)
                  fi

                  if [ -z "$CHANGED_YEARS" ]; then
                      exit 0
                  fi

                  HAS_ERROR=0

                  for YEAR in $CHANGED_YEARS; do
                      ZIP_NAME="card-art-${YEAR}.zip"
                      echo "Processing $ZIP_NAME..."

                      gh release download assets -p "$ZIP_NAME" || true

                      if [ -d "card-art/$YEAR" ]; then
                          set +e
                          zip -jruq "$ZIP_NAME" "card-art/$YEAR"
                          ZIP_EXIT=$?
                          set -e

                          if [ $ZIP_EXIT -eq 0 ]; then
                              gh release upload assets "$ZIP_NAME" --clobber || \
                              gh release create assets "$ZIP_NAME" --title "Card Art Assets" --notes "released on ${{ steps.date.outputs.NOW }}" || \
                              { echo "Error: gh release upload/create failed"; HAS_ERROR=1; }
                              gh release edit assets --notes "last updated on ${{ steps.date.outputs.NOW }}"
                          elif [ $ZIP_EXIT -ne 12 ]; then
                              { echo "Error: zip failed with exit code $ZIP_EXIT"; HAS_ERROR=1; }
                          fi
                      fi

                      rm -f "$ZIP_NAME"
                  done

                  if [ $HAS_ERROR -ne 0 ]; then
                      exit 1
                  fi

repos:
    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.1.0
      hooks:
          - id: prettier
            files: \.(md|js|jsx|ts|tsx|htm|html|css|json|jsonc|yml|yaml|clang-format)$

    - repo: https://github.com/pycqa/isort
      rev: 8.0.1
      hooks:
          - id: isort
            args: ["--profile", "black"]
            files: \.(py)$

    - repo: https://github.com/psf/black
      rev: 26.3.1
      hooks:
          - id: black
            args:
                - --safe
                - --workers=4
                - --target-version=py312
                - --line-length=160
            files: \.(py)$
